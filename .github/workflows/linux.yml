name: Linux ETP

on:
  push:
    branches: [linux]
  pull_request:
    paths: ["linux/**", ".github/workflows/linux.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r linux/requirements.txt
      - run: PYTHONPATH=linux python -m unittest discover -s linux/tests -v
